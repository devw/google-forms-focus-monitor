<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Google Forms Focus Monitor</title>
<style>
* { box-sizing: border-box }
body { margin: 0; background: #f3f6f4; color: #19362d; font: 1rem/1.55 "Inter", system-ui, sans-serif }
main { max-width: 42rem; margin: 9vh auto; padding: 1.75rem }
h1 { font-size: clamp(2rem,5vw,3.25rem); line-height: 1.1; letter-spacing: -.035em }
label { display: block; font-weight: 650; margin-top: 2rem }
input,button { font: inherit; border: 1px solid #758980; border-radius: .45rem; padding: .6rem .9rem }
input { width: 100%; margin: .4rem 0 1rem }
button { background: #205844; color: white; cursor: pointer }
button:focus-visible,input:focus-visible { outline: 3px solid #a46619; outline-offset: 3px }
nav { display: flex; align-items: center; flex-wrap: wrap; gap: .65rem; padding: .6rem 1rem }
#delivery { position: fixed; right: 1rem; bottom: 0; background: #fff5d6; padding: .5rem 1rem; border-radius: .4rem }
#exam { height: 100dvh; display: flex; flex-direction: column }
iframe { flex: 1; min-height: 0; width: 100%; border: 0; background: white }
[hidden] { display: none !important }
</style>
<main id="welcome">
<h1>Google Forms Focus Monitor</h1>
<p id="notice">Start a quiz in fullscreen. This page records fullscreen exits and time spent with the quiz tab hidden. The event log stays in this tab and clears on reload.</p>
<form id="setup">
<div id="form-choice"><label for="url">Google Form respondent link</label>
<input type="url" id="url" required placeholder="https://docs.google.com/forms/d/e/…/viewform">
</div>
<div id="identity" hidden><label for="student">Student ID or assigned code</label><input id="student" maxlength="80" autocomplete="off"></div>
<button>Start quiz</button>
</form>
<p id="error" role="alert"></p>
</main>
<section id="exam" hidden aria-label="Quiz session">
<nav><span id="status" role="status"></span><button id="resume" hidden>Return to fullscreen</button><button id="finish">Finish session</button></nav>
<iframe id="quiz" title="Google Forms quiz"></iframe>
</section>
<main id="summary" hidden><h1>Session log</h1><ol id="log"></ol><button id="again">Start another session</button></main>
<p id="delivery" role="status" hidden></p>
<script src="monitor.js" defer></script>
</html>
